project:
  name: "aspirateurs-chantier.fr"
  domain: "https://aspirateurs-chantier.fr"
  language: "fr"

content:
  scope:
    - "/marques/"
  source_of_truth: "_generate.py"
  brand_source_of_truth: "_generate_brands.py"
  generation_order:
    - "python _generate.py (site shell when a full rebuild is needed)"
    - "python _generate_guides.py + guide supplements/normalization"
    - "python _generate_comparatifs.py + comparison normalization"
    - "python _generate_brands.py"
  mode: "auto"

quality:
  quality_reference: "/marques/bosch/"
  draft_robots: "noindex, follow"

routing:
  page_types:
    - BRAND_HUB
    - PRODUCT
    - REVIEW
    - SERVICE
    - ACCESSORY_HUB
    - ALTERNATIVES

entities:
  require_entity_map: true
  require_current_range: true
  require_ecosystem_map: true
  require_brand_positioning: true

evidence:
  prefer_primary_sources: true
  statuses:
    - VERIFIED
    - SUPPORTED
    - INFERRED
    - UNKNOWN
    - OUTDATED
    - CONTRADICTED

internal_linking:
  required_paths:
    - "/comparatifs/"
    - "/guides/"
    - "/usages/"
  minimum_contextual_links: 6
  minimum_unique_targets: 5
  require_product_link_on_brand_hub: true
  require_comparison_link_when_relevant: true

workflow:
  brands_dir: ".content/brands"
  briefs_dir: ".content/briefs"
  reviews_dir: ".content/reviews"
  require_human_validation_before_publish: true
  allow_automatic_merge: false

quality_gate:
  minimum_h2_brand_hub: 7
  minimum_h2_product: 6
  minimum_sources: 3
  require_limit_section: true
  require_choose_avoid: true
  require_noindex_in_draft: true

publish_gate:
  skill: ".agents/skills/brand-editorial-publish-gate/SKILL.md"
  scope:
    - "/marques/"
  current_page_types:
    - DIRECTORY
    - BRAND_HUB
  architecture:
    brand_directory: "/marques/"
    brand_hubs: "/marques/<marque>/"
    product_pages: "/modeles/"
    comparisons: "/comparatifs/"
    guides: "/guides/"
    use_cases: "/usages/"
  require_pass_before_indexing: true
  require_human_validation_before_indexing: true
  keep_noindex_on_fail: true
  allow_automatic_rewrite_on_fail: false
  output_dir: ".content/reviews"
  domain_checks:
    require_explicit_dust_class_evidence: true
    distinguish_hepa_from_whole_vacuum_class_h: true
    compare_airflow_and_vacuum_only_with_measurement_context: true
    forbid_watts_as_direct_suction_proxy: true
    distinguish_gross_net_and_liquid_capacity: true
    verify_tool_socket_load_by_model_and_market: true
    distinguish_filter_cleaning_modes: true
    distinguish_acd_at_ex_and_zone_22: true
    require_extra_care_for_hazardous_dust: true
    require_current_model_and_market_status: true
    hide_internal_status_codes_from_reader: true
