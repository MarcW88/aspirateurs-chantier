    "summary": "Kärcher est l'une des marques les plus larges de ce marché : la famille WD vise surtout le nettoyage eau/poussière, le garage et la rénovation, tandis que la gamme professionnelle NT couvre les chantiers exigeants et des aspirateurs de sécurité L, M ou H. Le bon choix dépend donc davantage de la famille que du logo Kärcher lui-même.",
