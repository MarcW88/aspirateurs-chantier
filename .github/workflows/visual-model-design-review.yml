name: Visual design review — models

on:
  pull_request:
    branches:
      - main
    paths:
      - "modeles/**"
      - "style.css"
      - "design-v2.css"
      - "design-v2-rollout.css"
      - "home-model-polish.css"
      - "model-pages-v3.css"
      - "_apply_design_v2.py"
      - "design-v2.js"
      - ".agents/skills/site-design-review/**"
      - ".github/workflows/visual-model-design-review.yml"
  workflow_dispatch:

jobs:
  visual-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Capture representative model pages
        run: >-
          node .agents/skills/site-design-review/scripts/run-visual-review.mjs
          --route /modeles/bosch-advancedvac-20/
          --route /modeles/bosch-gas-18v-10-l/
          --route /modeles/bosch-gas-35-m-afc/
          --route /modeles/karcher-wd6/
          --route /modeles/karcher-nt-30-1-tact/
          --route /modeles/makita-vc4210mx/
          --route /modeles/festool-ctl-midi/
          --output .artifacts/design-review/models-v3

      - name: Upload model visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-design-review-v3
          path: .artifacts/design-review/models-v3/
          if-no-files-found: warn
          retention-days: 14
