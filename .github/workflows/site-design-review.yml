name: Apply site design review

on:
  push:
    branches:
      - design/site-design-review
    paths:
      - "DESIGN.md"
      - ".agents/skills/site-design-review/**"
      - "_apply_site_design.py"
      - "_validate_site_design.py"
      - "site.js"
      - "style.css"
      - "_generate.py"
      - ".github/workflows/site-design-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/site-design-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply design system to generated site
        run: python _apply_site_design.py

      - name: Validate design and accessibility gates
        run: python _validate_site_design.py

      - name: Check idempotence
        run: |
          git diff > /tmp/design-first.diff
          python _apply_site_design.py
          git diff > /tmp/design-second.diff
          cmp /tmp/design-first.diff /tmp/design-second.diff

      - name: Check whitespace
        run: git diff --check

      - name: Commit rendered design changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css _generate.py site.js .content/reviews/site-design-review-2026-09-08.md
          find . -name index.html -print0 | xargs -0 git add
          if git diff --cached --quiet; then
            echo "No rendered design changes to commit."
          else
            git commit -m "[skip ci] Apply site design review globally"
            git push origin HEAD:design/site-design-review
          fi
