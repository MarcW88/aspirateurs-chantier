name: Validate brand generation

on:
  pull_request:
    branches:
      - main
    paths:
      - "_generate_brand_content.py"
      - "_generate_brands.py"
      - "_generate_bosch.py"
      - "_generate_brand_overrides.py"
      - "_brand_rollout_polish.py"
      - "_validate_brands.py"
      - "brand-workflow.config.yaml"
      - ".content/brands/**"
      - "marques/**"
      - ".github/workflows/validate-brand-generation.yml"
  push:
    branches:
      - main
    paths:
      - "_generate_brand_content.py"
      - "_generate_brands.py"
      - "_generate_bosch.py"
      - "_generate_brand_overrides.py"
      - "_brand_rollout_polish.py"
      - "_validate_brands.py"
      - "brand-workflow.config.yaml"
      - ".content/brands/**"
      - "marques/**"
      - ".github/workflows/validate-brand-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shared skill stack
        run: python validate_brand_skill_stack.py

      - name: Regenerate all brand content canonically
        run: python _generate_brand_content.py

      - name: Validate brand machine integrity
        run: python _validate_brands.py

      - name: Preserve bespoke brand structures
        shell: bash
        run: |
          declare -A checks=(
            [bosch]='univers-bosch deux-systemes-18v'
            [karcher]='wd-vs-nt tact-acd'
            [festool]='logique-systeme classes-ct'
            [makita]='lire-reference lxt-xgt'
            [dewalt]='systeme-chantier dcv586m'
            [parkside]='logique-parkside disponibilite'
            [nilfisk]='deux-univers infiniclean'
            [mirka]='poncage-dabord 1217-1230'
          )
          for slug in "${!checks[@]}"; do
            page="marques/$slug/index.html"
            for id in ${checks[$slug]}; do
              grep -q "id=\"$id\"" "$page"
            done
            ! grep -q 'id="forces"' "$page"
            ! grep -q 'id="eviter"' "$page"
          done

      - name: Require committed generated artifacts
        run: git diff --exit-code -- marques .content/brands
