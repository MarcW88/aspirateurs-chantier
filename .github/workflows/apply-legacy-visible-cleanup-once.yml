name: Apply legacy visible cleanup once

on:
  push:
    branches: [fix/remove-legacy-visible-mentions]
    paths:
      - '.github/workflows/apply-legacy-visible-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-visible-mentions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove visible noindex and 2025 legacy copy
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          footer_old = '© 2025 aspirateurs-chantier.fr — Base de données indépendante'
          footer_new = '© aspirateurs-chantier.fr — Base de données indépendante'
          noindex_old = 'Mise à jour : 11/09/2026. Page d’orientation générale maintenue en noindex jusqu’à validation humaine.'
          noindex_new = 'Mise à jour : 11/09/2026.'
          makita_old = 'Makita France — tract aspiration 2025'
          makita_new = 'Makita France — tract aspiration'
          inrs_old = 'Une étude INRS publiée en 2025 puis présentée en 2026'
          inrs_new = 'Une étude INRS présentée en 2026'

          html_paths = sorted(Path('.').rglob('index.html'))
          changed_html = 0
          for path in html_paths:
              text = path.read_text(encoding='utf-8')
              new = (text
                     .replace(footer_old, footer_new)
                     .replace(noindex_old, noindex_new)
                     .replace(makita_old, makita_new)
                     .replace(inrs_old, inrs_new))
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_html += 1

          source_replacements = {
              Path('_generate.py'): [
                  (footer_old, footer_new),
                  ('Meilleur aspirateur de chantier — Comparatif 2025', 'Meilleur aspirateur de chantier — Comparatif'),
                  ('Quel est le meilleur aspirateur de chantier en 2025 ? Notre comparatif indépendant avec données techniques vérifiées.', 'Quel est le meilleur aspirateur de chantier ? Notre comparatif indépendant avec données techniques vérifiées.'),
              ],
              Path('_generate_makita.py'): [(makita_old, makita_new)],
              Path('.content/brands/makita.yaml'): [(makita_old, makita_new)],
              Path('.content/comparisons/v2/aspirateur-classe-m.html'): [(inrs_old, inrs_new)],
              Path('.content/comparisons/v2/meilleur-aspirateur-de-chantier.html'): [(noindex_old, noindex_new)],
          }
          for path, replacements in source_replacements.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          class VisibleTextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script', 'style'}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script', 'style'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          failures = []
          for path in html_paths:
              parser = VisibleTextParser()
              parser.feed(path.read_text(encoding='utf-8'))
              visible = ' '.join(parser.parts)
              if 'noindex' in visible.lower():
                  failures.append(f'{path}: visible noindex remains')
              if '2025' in visible:
                  failures.append(f'{path}: visible 2025 remains')

          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'Updated visible legacy copy across {changed_html} HTML files; validation PASS.')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/index.html' _generate.py _generate_makita.py .content/brands/makita.yaml .content/comparisons/v2/*.html
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'fix(content): remove legacy noindex and 2025 mentions'
          git push origin HEAD:fix/remove-legacy-visible-mentions
