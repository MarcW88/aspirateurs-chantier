name: Generate brand rollout

on:
  push:
    branches:
      - brand-pages-methodology-rollout
    paths:
      - '_generate_brand_overrides.py'
      - '_generate_brand_content.py'
      - '_generate_bosch.py'
      - '_generate_brands.py'
      - '.github/workflows/brand-rollout-generate.yml'

permissions:
  contents: write

jobs:
  generate-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-pages-methodology-rollout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared skill stack
        run: python validate_brand_skill_stack.py
      - name: Generate all brand hubs canonically
        run: python _generate_brand_content.py
      - name: Validate brand machine integrity
        run: python _validate_brands.py
      - name: Verify bespoke structures
        shell: bash
        run: |
          declare -A checks=(
            [bosch]='univers-bosch deux-systemes-18v'
            [karcher]='wd-vs-nt tact-acd'
            [festool]='logique-systeme classes-ct'
            [makita]='lire-reference lxt-xgt'
            [dewalt]='systeme-chantier dcv586m'
            [parkside]='logique-parkside disponibilite'
            [nilfisk]='deux-univers infiniclean'
            [mirka]='poncage-dabord 1217-1230'
          )
          for slug in "${!checks[@]}"; do
            page="marques/$slug/index.html"
            for id in ${checks[$slug]}; do grep -q "id=\"$id\"" "$page"; done
            grep -q '<meta name="robots" content="noindex, follow">' "$page"
            ! grep -q 'id="forces"' "$page"
            ! grep -q 'id="eviter"' "$page"
          done
      - name: Check idempotence
        shell: bash
        run: |
          before=$(git diff | sha256sum | cut -d' ' -f1)
          python _generate_brand_content.py
          after=$(git diff | sha256sum | cut -d' ' -f1)
          test "$before" = "$after"
      - name: HTML whitespace check
        run: git diff --check
      - name: Commit generated rollout
        shell: bash
        run: |
          if git diff --quiet -- marques .content/brands; then
            echo "Brand rollout already generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marques .content/brands
          git commit -m "Render bespoke brand methodology rollout"
          git push origin HEAD:brand-pages-methodology-rollout
