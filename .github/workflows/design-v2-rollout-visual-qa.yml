name: Editorial v2 rollout visual QA

on:
  push:
    branches:
      - feat/design-editorial-v2-rollout
    paths:
      - "design-v2.css"
      - "design-v2-rollout.css"
      - "design-v2.js"
      - "index.html"
      - "accessoires/**"
      - "comparatifs/**"
      - "guides/**"
      - "marques/**"
      - "modeles/**"
      - "usages/**"
      - "a-propos/**"
      - ".github/workflows/design-v2-rollout-visual-qa.yml"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-editorial-v2-rollout
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          google-chrome --version
      - name: Serve site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/design-v2-rollout-server.log 2>&1 &
          sleep 2
      - name: Validate and capture representative pages
        run: |
          mkdir -p screenshots
          cat > capture-rollout.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({channel:'chrome', headless:true});
          const pages = [
            ['home','/'],
            ['hub','/modeles/'],
            ['brand','/marques/bosch/'],
            ['usage','/usages/aspirateur-atelier/'],
            ['guide','/guides/classes-l-m-h/'],
            ['model','/modeles/bosch-gas-35-m-afc/'],
            ['comparison','/comparatifs/aspirateur-classe-m/'],
            ['accessory','/accessoires/filtres-aspirateur-chantier/'],
            ['static','/a-propos/']
          ];
          for (const [name,path] of pages) {
            for (const [mode,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:8000'+path, {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(500);
              const state = await page.evaluate(() => ({
                design: document.body.classList.contains('design-v2'),
                rolloutCss: [...document.styleSheets].some(s => (s.href || '').includes('design-v2-rollout.css')),
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
              }));
              if (!state.design) throw new Error(`${name}-${mode}: missing design-v2 body class`);
              if (!state.rolloutCss) throw new Error(`${name}-${mode}: rollout CSS not loaded`);
              if (state.overflow) throw new Error(`${name}-${mode}: global horizontal overflow`);
              if (mode === 'mobile') {
                const burger = page.locator('.burger');
                if (await burger.count()) {
                  if (!await burger.isVisible()) throw new Error(`${name}: burger is not visible`);
                  await burger.click();
                  if (await burger.getAttribute('aria-expanded') !== 'true') throw new Error(`${name}: burger did not open`);
                  await burger.click();
                }
                const sidebar = page.locator('.content-sidebar');
                const main = page.locator('.content-main');
                if (await sidebar.count() && await main.count()) {
                  const toc = page.locator('.mobile-toc-box');
                  if (!await toc.count()) throw new Error(`${name}: mobile TOC was not promoted before article`);
                }
              }
              await page.screenshot({path:`screenshots/${name}-${mode}.png`, fullPage:true});
              await context.close();
            }
          }
          await browser.close();
          JS
          node capture-rollout.mjs
          rm capture-rollout.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-v2-rollout-screenshots
          path: screenshots/*.png
          retention-days: 7
