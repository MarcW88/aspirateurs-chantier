name: Apply homepage wide polish once

on:
  push:
    branches: [feat/home-wide-polish]
    paths:
      - '.github/workflows/home-wide-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-wide-polish
      - name: Apply targeted homepage fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home-model-polish.css')
          css = css_path.read_text()
          marker = '/* ---------- Homepage wide composition pass ---------- */'
          if marker not in css:
              css += r'''

          /* ---------- Homepage wide composition pass ---------- */
          .design-v2.design-home .home-hero {
            padding: 66px 0 60px;
          }
          .design-v2.design-home .home-hero > .container {
            max-width: 1380px;
            padding-inline: clamp(24px, 4vw, 56px);
          }
          .design-v2.design-home .home-hero .home-hero-grid {
            width: 100%;
            max-width: none;
            grid-template-columns: minmax(0, .92fr) minmax(0, 1.18fr);
            gap: clamp(46px, 5.5vw, 86px);
            align-items: center;
          }
          .design-v2.design-home .home-hero-copy {
            max-width: none;
            padding: 28px 0;
          }
          .design-v2.design-home .home-hero-copy .hero-title {
            max-width: 720px;
            font-size: clamp(2.55rem, 4vw, 3.7rem);
            line-height: 1.01;
            letter-spacing: -.035em;
          }
          .design-v2.design-home .home-hero-copy .hero-desc {
            max-width: 670px;
          }
          .design-v2.design-home .home-hero-visual {
            width: 100%;
            min-height: 0;
            aspect-ratio: 16 / 10;
          }
          .design-v2.design-home .home-hero-visual img {
            min-height: 0;
            height: 100%;
            object-position: center;
          }

          .design-v2.design-home .usage-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0 28px;
          }
          .design-v2.design-home .usage-card {
            min-height: 132px;
            padding-right: 28px;
          }
          .design-v2.design-home .usage-card p {
            line-height: 1.5;
          }
          .design-v2.design-home .home-reading-media {
            aspect-ratio: 3 / 2;
          }

          @media (max-width: 1120px) {
            .design-v2.design-home .home-hero .home-hero-grid {
              grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
              gap: 42px;
            }
            .design-v2.design-home .usage-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }

          @media (max-width: 820px) {
            .design-v2.design-home .home-hero {
              padding: 42px 0 0;
            }
            .design-v2.design-home .home-hero > .container {
              padding-inline: 20px;
            }
            .design-v2.design-home .home-hero .home-hero-grid {
              grid-template-columns: 1fr;
              gap: 30px;
            }
            .design-v2.design-home .home-hero-copy {
              padding: 0;
            }
            .design-v2.design-home .home-hero-copy .hero-title {
              font-size: clamp(2.25rem, 10vw, 3rem);
            }
            .design-v2.design-home .home-hero-visual {
              max-width: none;
              min-height: 0;
              margin-inline: -20px;
              width: calc(100% + 40px);
              border-left: 0;
              border-right: 0;
              aspect-ratio: 16 / 10;
            }
            .design-v2.design-home .home-hero-visual img {
              min-height: 0;
            }
          }

          @media (max-width: 680px) {
            .design-v2.design-home .usage-grid {
              grid-template-columns: 1fr;
              gap: 0;
            }
            .design-v2.design-home .usage-card {
              min-height: 0;
              padding: 16px 30px 16px 0;
            }
            .design-v2.design-home .home-reading-card {
              grid-template-columns: 132px minmax(0, 1fr);
            }
          }
          '''
              css_path.write_text(css)

          html_path = Path('index.html')
          html = html_path.read_text()
          start = html.index('<section class="section home-reading-section">')
          end = html.index('</section>', start) + len('</section>')
          block = html[start:end].replace('loading="lazy"', 'loading="eager"')
          html_path.write_text(html[:start] + block + html[end:])
          PY
      - name: Validate editorial coverage
        run: python validate_design_v2.py
      - name: Commit polish and remove one-shot workflow
        run: |
          rm .github/workflows/home-wide-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home-model-polish.css .github/workflows/home-wide-polish-once.yml
          git commit -m 'design: widen and balance homepage composition'
          git push origin HEAD:feat/home-wide-polish
