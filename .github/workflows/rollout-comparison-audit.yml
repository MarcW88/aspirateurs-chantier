name: Roll out audited comparison cluster

on:
  push:
    branches:
      - rollout-comparisons-after-audit-2026-09-09
    paths:
      - "_generate_comparison_overrides.py"
      - "_generate_comparison_content.py"
      - "_validate_comparison_rollout.py"
      - ".github/workflows/rollout-comparison-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize Python None literals from connector serialization
        run: |
          sed -i 's/"local": null/"local": None/g' _generate_comparison_overrides.py
      - name: Compile rollout code
        run: |
          python -m py_compile _generate_comparison_overrides.py
          python -m py_compile _generate_comparison_content.py
          python -m py_compile _validate_comparison_rollout.py
      - name: Generate comparison cluster in audited order
        run: python _generate_comparison_content.py
      - name: Validate persisted comparison data
        run: |
          for f in .content/comparisons/*.json; do
            python .agents/skills/comparison-content-workflow/scripts/validate_comparison_data.py "$f"
          done
      - name: Preserve draft indexing state
        run: |
          for f in comparatifs/*/index.html; do
            grep -q '<meta name="robots" content="noindex, follow">' "$f"
          done
      - name: Whitespace check
        run: git diff --check
      - name: Commit canonical rollout artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _generate_comparison_overrides.py _generate_comparison_content.py _validate_comparison_rollout.py _generate_comparatifs.py comparatifs .content/comparisons
          if git diff --cached --quiet; then
            echo "No rollout changes to commit."
          else
            git commit -m "Generate audited comparison rollout"
            git push origin HEAD:rollout-comparisons-after-audit-2026-09-09
          fi
