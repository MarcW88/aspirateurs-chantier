name: Pilot professional comparison

on:
  push:
    branches:
      - pilot-professional-comparison-2026-09-09
    paths:
      - "_generate_professional_comparison_override.py"
      - ".content/models/model-evidence.json"
      - ".github/workflows/pilot-professional-comparison.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and generate pilot
        run: |
          python -m py_compile _generate_professional_comparison_override.py
          python _generate_professional_comparison_override.py
      - name: Validate pilot ledger
        run: python .agents/skills/comparison-content-workflow/scripts/validate_comparison_data.py .content/comparisons/aspirateur-professionnel.json
      - name: Validate comparison cluster integrity
        run: python _validate_comparatifs.py
      - name: Preserve noindex
        run: grep -q '<meta name="robots" content="noindex, follow">' comparatifs/aspirateur-professionnel/index.html
      - name: Whitespace check
        run: git diff --check
      - name: Commit pilot artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs/aspirateur-professionnel/index.html .content/comparisons/aspirateur-professionnel.json
          if git diff --cached --quiet; then
            echo "No pilot changes to commit."
          else
            git commit -m "Generate professional comparison pilot"
            git push origin HEAD:pilot-professional-comparison-2026-09-09
          fi
