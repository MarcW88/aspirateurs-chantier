name: Apply reviewed home and model polish

on:
  push:
    branches:
      - feat/home-model-design-review
    paths:
      - "scripts/apply_home_model_review.py"
      - "home-model-polish.css"
      - "_apply_design_v2.py"
      - "validate_design_v2.py"
      - "_polish_comparison_rollout.py"
      - ".github/workflows/apply-home-model-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-model-design-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reviewed structure and labels
        run: |
          python scripts/apply_home_model_review.py
          python _polish_comparison_rollout.py
          python _apply_design_v2.py

      - name: Validate V2 contract and labels
        run: |
          python validate_design_v2.py
          if grep -R '<span class="ctype ctype-comp">Comp</span>' comparatifs/*/index.html; then
            echo "Legacy Comp label remains"
            exit 1
          fi
          grep -q '<meta name="robots" content="noindex, follow">' index.html
          for f in modeles/*/index.html comparatifs/*/index.html; do
            grep -q '<meta name="robots" content="noindex, follow">' "$f"
          done
          git diff --check

      - name: Commit rendered review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html modeles comparatifs .content/comparisons
          if git diff --cached --quiet; then
            echo "Reviewed pages already materialized."
          else
            git commit -m "design: materialize homepage and model review"
            git pull --rebase origin feat/home-model-design-review
            git push origin HEAD:feat/home-model-design-review
          fi
