name: Generate Kärcher WD 2 pilot

on:
  push:
    branches:
      - feat/model-karcher-wd2
    paths:
      - ".content/models/pages/karcher-wd2.html"
      - ".content/models/pages/karcher-wd2.meta.json"
      - ".github/workflows/generate-model-wd2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-karcher-wd2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render model pages
        run: python _generate_model_overrides.py
      - name: Commit only the WD 2 rendered page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeles/karcher-wd2/index.html
          if git diff --cached --quiet; then
            echo "No rendered model changes"
          else
            git commit -m "content: render Kärcher WD 2 model"
            git push origin HEAD:feat/model-karcher-wd2
          fi
