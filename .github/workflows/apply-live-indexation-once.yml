name: Apply live indexation once

on:
  push:
    branches: [feat/index-site]
    paths:
      - '.github/workflows/apply-live-indexation-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/index-site
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate live indexation state
        run: |
          python scripts/publish_indexation.py --migrate-source-guards
          python scripts/publish_indexation.py --check
      - name: Validate active editorial workflows
        run: |
          python validate_design_v2.py
          python validate_guide_quality.py
          python validate_guide_workflow.py
          python validate_usage_workflow.py
          python _validate_brands.py
          python _validate_comparatifs.py
      - name: Validate product layers after launch
        run: |
          python apply_product_cards.py all
          python apply_inline_affiliate_links.py
          python scripts/publish_indexation.py
          python validate_product_cards.py all
          python validate_inline_affiliate_links.py
          python scripts/publish_indexation.py --check
      - name: Package exact migrated files
        run: |
          mkdir -p .artifacts/indexation-migration/files
          git diff --name-only > .artifacts/indexation-migration/manifest.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p ".artifacts/indexation-migration/files/$(dirname "$file")"
            cp "$file" ".artifacts/indexation-migration/files/$file"
          done < .artifacts/indexation-migration/manifest.txt
          cat .artifacts/indexation-migration/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: indexation-migration
          path: .artifacts/indexation-migration
          retention-days: 7
