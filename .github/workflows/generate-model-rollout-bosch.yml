name: Generate Bosch model rollout

on:
  push:
    branches:
      - feat/model-rollout-bosch
    paths:
      - ".content/models/pages/bosch-advancedvac-20.html"
      - ".content/models/pages/bosch-advancedvac-20.meta.json"
      - ".content/models/pages/bosch-gas-12-25-pl.html"
      - ".content/models/pages/bosch-gas-12-25-pl.meta.json"
      - ".content/models/pages/bosch-gas-35-l-afc.html"
      - ".content/models/pages/bosch-gas-35-l-afc.meta.json"
      - ".github/workflows/generate-model-rollout-bosch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-rollout-bosch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render model pages
        run: python _generate_model_overrides.py
      - name: Commit rendered Bosch pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeles/bosch-advancedvac-20/index.html modeles/bosch-gas-12-25-pl/index.html modeles/bosch-gas-35-l-afc/index.html
          if git diff --cached --quiet; then
            echo "No rendered model changes"
          else
            git commit -m "content: render Bosch model rollout"
            git push origin HEAD:feat/model-rollout-bosch
          fi
