name: Apply model v3 once

on:
  push:
    branches:
      - design/model-pages-v3
    paths:
      - '.github/workflows/apply-model-v3-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/model-pages-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply editorial assets to model pages
        run: |
          python _apply_design_v2.py
          python validate_design_v2.py
      - name: Verify model pages stay indexable and affiliate tracking is intact
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [p for p in Path('modeles').glob('*/index.html')]
          assert pages, 'No model pages found'
          errors=[]
          for p in pages:
              t=p.read_text(encoding='utf-8')
              if '<meta name="robots" content="index, follow">' not in t:
                  errors.append(f'{p}: robots directive')
              if '/model-pages-v3.css' not in t:
                  errors.append(f'{p}: model v3 asset')
              if 'amazon.fr' in t and 'tag=500339-21' not in t:
                  errors.append(f'{p}: affiliate tag')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Model V3 materialization: PASS — {len(pages)} pages')
          PY
      - name: Commit materialized model pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modeles
          if git diff --cached --quiet; then
            echo 'No model materialization changes.'
            exit 0
          fi
          git commit -m 'design: materialize model v3 stylesheet'
          git push origin HEAD:design/model-pages-v3
