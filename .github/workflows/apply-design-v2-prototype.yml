name: Apply design v2 prototype

on:
  push:
    branches:
      - feat/design-editorial-v2
    paths:
      - "design-v2.css"
      - "design-v2.js"
      - "_apply_design_v2_prototype.py"
      - ".github/workflows/apply-design-v2-prototype.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-editorial-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply prototype classes and links
        run: python _apply_design_v2_prototype.py
      - name: Commit prototype pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html \
            guides/comment-choisir-aspirateur-de-chantier/index.html \
            modeles/bosch-gas-35-l-afc/index.html \
            comparatifs/meilleur-aspirateur-de-chantier/index.html
          if git diff --cached --quiet; then
            echo "No prototype page changes"
          else
            git commit -m "design: apply editorial v2 to prototype pages"
            git push origin HEAD:feat/design-editorial-v2
          fi
