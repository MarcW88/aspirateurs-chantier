name: Generate GAS 35 M AFC pilot

on:
  push:
    branches:
      - feat/model-gas35m-pilot
    paths:
      - ".content/models/pages/bosch-gas-35-m-afc.html"
      - ".content/models/pages/bosch-gas-35-m-afc.meta.json"
      - "_generate_model_overrides.py"
      - ".github/workflows/generate-model-gas35m-pilot.yml"
      - "modeles/bosch-gas-35-m-afc/index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-gas35m-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render model pages
        run: python _generate_model_overrides.py
      - name: Commit only the pilot rendered page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeles/bosch-gas-35-m-afc/index.html
          if git diff --cached --quiet; then
            echo "No rendered pilot changes"
          else
            git commit -m "content: render GAS 35 M AFC pilot"
            git push origin HEAD:feat/model-gas35m-pilot
          fi
