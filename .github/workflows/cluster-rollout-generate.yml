name: Generate ordered cluster rollout

on:
  push:
    branches:
      - cluster-audit-rollout
    paths:
      - '_generate_model_overrides.py'
      - '_generate_usage_overrides.py'
      - '_generate_professional_comparison_override.py'
      - '_generate_brand_hub_index.py'
      - '_generate_cluster_content.py'
      - '_apply_cluster_audit_metadata.py'
      - '_validate_cluster_rollout.py'
      - '.content/models/**'
      - '.content/cluster-audits/**'
      - '.github/workflows/cluster-rollout-generate.yml'

permissions:
  contents: write

jobs:
  generate-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cluster-audit-rollout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cluster in audited order
        run: python _generate_cluster_content.py
      - name: Check generated HTML whitespace
        run: git diff --check
      - name: Check idempotence
        shell: bash
        run: |
          before=$(git diff | sha256sum | cut -d' ' -f1)
          python _generate_cluster_content.py
          after=$(git diff | sha256sum | cut -d' ' -f1)
          test "$before" = "$after"
      - name: Commit generated cluster artifacts
        shell: bash
        run: |
          if git diff --quiet -- modeles usages marques comparatifs .content/brands; then
            echo "Cluster artifacts already generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeles usages marques comparatifs .content/brands
          git commit -m "Render ordered cluster rollout"
          git push origin HEAD:cluster-audit-rollout
