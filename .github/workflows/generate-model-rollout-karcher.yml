name: Generate Kärcher model rollout

on:
  push:
    branches:
      - feat/model-rollout-karcher
    paths:
      - ".content/models/pages/karcher-wd5.html"
      - ".content/models/pages/karcher-wd5.meta.json"
      - ".content/models/pages/karcher-wd6.html"
      - ".content/models/pages/karcher-wd6.meta.json"
      - ".content/models/pages/karcher-nt-30-1-tact.html"
      - ".content/models/pages/karcher-nt-30-1-tact.meta.json"
      - ".github/workflows/generate-model-rollout-karcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-rollout-karcher
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render model pages
        run: python _generate_model_overrides.py
      - name: Commit rendered Kärcher pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeles/karcher-wd5/index.html modeles/karcher-wd6/index.html modeles/karcher-nt-30-1-tact/index.html
          if git diff --cached --quiet; then
            echo "No rendered model changes"
          else
            git commit -m "content: render Kärcher model rollout"
            git push origin HEAD:feat/model-rollout-karcher
          fi
