name: Fix comparison live state once

on:
  push:
    branches: [fix/remove-legacy-visible-mentions]
    paths:
      - '.github/workflows/fix-comparison-live-state-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-visible-mentions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align comparison generators with live indexation
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('_materialize_comparison_v2.py'): [
                  ('notes["noindex_during_rollout"] = True', 'notes["noindex_during_rollout"] = False'),
              ],
              Path('_generate_comparison_overrides.py'): [
                  ('"noindex_during_rollout": True,', '"noindex_during_rollout": False,'),
              ],
              Path('_generate_professional_comparison_override.py'): [
                  ("'noindex_during_pilot': True,", "'noindex_during_pilot': False,"),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path}: expected marker missing: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate canonical comparison artifacts
        run: |
          python _generate_comparison_content.py
          if [ -f .content/products/placements.json ]; then
            python apply_product_cards.py comparisons
            python validate_product_cards.py comparisons
          fi
          python scripts/publish_indexation.py
          python scripts/publish_indexation.py --check
          python _validate_comparison_rollout.py
      - name: Verify no visible legacy copy remains in comparisons
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style'}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script','style'} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)
          bad=[]
          for path in Path('comparatifs').rglob('index.html'):
              p=P(); p.feed(path.read_text(encoding='utf-8')); visible=' '.join(p.parts)
              if 'noindex' in visible.lower(): bad.append(f'{path}: noindex')
              if '2025' in visible: bad.append(f'{path}: 2025')
          if bad: raise SystemExit('\n'.join(bad))
          print('Comparison visible-copy cleanup: PASS')
          PY
      - name: Commit canonical live state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _materialize_comparison_v2.py _generate_comparison_overrides.py _generate_professional_comparison_override.py .content/comparisons comparatifs sitemap.xml
          if git diff --cached --quiet; then
            echo 'No live-state changes to commit.'
            exit 0
          fi
          git commit -m 'fix(seo): keep comparison generators indexable'
          git push origin HEAD:fix/remove-legacy-visible-mentions
