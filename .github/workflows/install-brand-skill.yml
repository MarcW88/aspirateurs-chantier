name: Install brand content workflow

on:
  push:
    branches:
      - content/brand-pages-workflow
    paths:
      - ".brand-skill.bundle.b64"
      - ".github/workflows/install-brand-skill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/brand-pages-workflow
          fetch-depth: 0
      - name: Extract skill and configure project
        run: |
          base64 -d .brand-skill.bundle.b64 > /tmp/brand-skill.zip
          rm -rf /tmp/brand-skill .agents/skills/brand-content-workflow
          mkdir -p /tmp/brand-skill .agents/skills .content/brands
          unzip -q /tmp/brand-skill.zip -d /tmp/brand-skill
          cp -R /tmp/brand-skill/brand-content-workflow .agents/skills/brand-content-workflow
          cp .agents/skills/brand-content-workflow/brand-workflow.config.example.yaml brand-workflow.config.yaml
          python - <<'PY'
          from pathlib import Path
          p = Path('brand-workflow.config.yaml')
          s = p.read_text()
          s = s.replace('name: "example-site"', 'name: "aspirateurs-chantier.fr"')
          s = s.replace('domain: "https://example.com"', 'domain: "https://aspirateurs-chantier.fr"')
          s = s.replace('quality_reference: "/marques/reference/"', 'quality_reference: "/marques/bosch/"')
          s = s.replace('draft_robots: "noindex,follow"', 'draft_robots: "noindex, follow"')
          p.write_text(s)

          v = Path('.agents/skills/brand-content-workflow/scripts/validate_brand_quality.py')
          s = v.read_text()
          old = "if args.require_noindex and 'name=\"robots\" content=\"noindex,follow\"' not in html:\n        issues.append(\"noindex,follow absent\")"
          new = "if args.require_noindex and re.search(r'name=\"robots\"\\s+content=\"noindex,\\s*follow\"', html, re.I) is None:\n        issues.append(\"noindex,follow absent\")"
          if old not in s:
              raise SystemExit('Expected validator noindex check not found')
          v.write_text(s.replace(old, new))
          PY
          touch .content/brands/.gitkeep
      - name: Commit installed skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/brand-content-workflow brand-workflow.config.yaml .content/brands/.gitkeep
          git rm .brand-skill.bundle.b64 .github/workflows/install-brand-skill.yml
          git commit -m "Install brand content workflow"
          git push origin HEAD:content/brand-pages-workflow
