name: Refine homepage wide polish once

on:
  push:
    branches: [feat/home-wide-polish]
    paths:
      - '.github/workflows/home-wide-refine-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-wide-polish
      - name: Refine hero balance and full-page image QA
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home-model-polish.css')
          css = css_path.read_text()
          replacements = {
              'max-width: 1380px;\n  padding-inline: clamp(24px, 4vw, 56px);': 'max-width: 1440px;\n  padding-inline: clamp(24px, 3.5vw, 48px);',
              'grid-template-columns: minmax(0, .92fr) minmax(0, 1.18fr);\n  gap: clamp(46px, 5.5vw, 86px);': 'grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);\n  gap: clamp(42px, 4.5vw, 68px);',
              'font-size: clamp(2.55rem, 4vw, 3.7rem);': 'font-size: clamp(2.55rem, 3.85vw, 3.55rem);',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'CSS target not found: {old}')
              css = css.replace(old, new, 1)
          css_path.write_text(css)

          script_path = Path('.agents/skills/site-design-review/scripts/run-visual-review.mjs')
          script = script_path.read_text()
          needle = "      await page.evaluate(() => document.fonts?.ready);\n\n      const measurements = await page.evaluate(() => {"
          replacement = """      await page.evaluate(() => document.fonts?.ready);
      // Full-page screenshots can otherwise capture off-viewport images before Chromium paints them.
      await page.evaluate(async () => {
        const step = Math.max(Math.floor(window.innerHeight * 0.8), 400);
        for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
          window.scrollTo(0, y);
          await new Promise(resolve => setTimeout(resolve, 35));
        }
        window.scrollTo(0, 0);
      });
      await page.waitForTimeout(120);

      const measurements = await page.evaluate(() => {"""
          if needle not in script:
              raise SystemExit('Visual-review insertion point not found')
          script_path.write_text(script.replace(needle, replacement, 1))
          PY
      - name: Validate editorial coverage
        run: python validate_design_v2.py
      - name: Commit refinement and remove one-shot workflow
        run: |
          rm .github/workflows/home-wide-refine-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-model-polish.css .agents/skills/site-design-review/scripts/run-visual-review.mjs .github/workflows/home-wide-refine-once.yml
          git commit -m 'design: refine homepage width and visual QA'
          git push origin HEAD:feat/home-wide-polish
