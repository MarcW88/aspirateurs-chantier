name: One-time CSS consolidation migration

on:
  push:
    branches:
      - css-consolidation-safe
    paths:
      - ".github/workflows/css-consolidation-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-consolidation-safe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the single CSS bundle
        run: python _build_css.py
      - name: Normalize stylesheet links
        run: python _apply_design_v2.py
      - name: Validate the normalized site
        run: |
          python validate_design_v2.py
          python _build_css.py --check
          git diff --check
      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html accessoires comparatifs guides marques modeles usages \
            a-propos contact mentions-legales methode-de-test transparence-affiliation
          git commit -m "refactor(css): normalize site to one generated stylesheet"
          git push origin HEAD:css-consolidation-safe
