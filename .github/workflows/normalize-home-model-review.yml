name: Normalize reviewed comparison artifacts once

on:
  push:
    branches:
      - feat/home-model-design-review
    paths:
      - '.github/workflows/normalize-home-model-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-model-design-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild canonical comparisons and guarded product layer
        run: |
          python _generate_comparison_content.py
          python _apply_design_v2.py
          python apply_product_cards.py comparisons
          python validate_product_cards.py comparisons
          if grep -R '<span class="ctype ctype-comp">Comp</span>' comparatifs/*/index.html; then
            echo 'Legacy Comp label remains after canonical generation'
            exit 1
          fi
          grep -R '<span class="ctype ctype-comp">Comparatif</span>' comparatifs/*/index.html >/dev/null
          git diff --check

      - name: Commit canonical branch state and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs .content/comparisons
          git rm .github/workflows/normalize-home-model-review.yml
          git commit -m "chore: normalize reviewed comparison artifacts"
          git pull --rebase origin feat/home-model-design-review
          git push origin HEAD:feat/home-model-design-review
