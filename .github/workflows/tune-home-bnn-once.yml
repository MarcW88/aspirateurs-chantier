name: Tune homepage closer to bloc-notes numerique

on:
  push:
    branches:
      - feat/home-bnn-tune
    paths:
      - '.github/workflows/tune-home-bnn-once.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-bnn-tune
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted homepage tune
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          hero = '''<section class="hero home-hero">
            <div class="container">
              <div class="hero-inner home-hero-grid">
                <div class="home-hero-copy">
                  <div class="hero-eyebrow">Comparatifs &amp; guides indépendants</div>
                  <h1 class="hero-title">Le bon aspirateur de chantier,<br>selon votre manière de travailler.</h1>
                  <p class="hero-desc lead">Comparatifs, fiches modèles documentées et guides pour choisir un aspirateur réellement adapté à vos poussières, vos outils et votre chantier.</p>
                  <div class="hero-actions">
                    <a href="/comparatifs/meilleur-aspirateur-de-chantier/" class="btn btn-primary btn-lg">Comparer les modèles</a>
                    <a href="/guides/comment-choisir-aspirateur-de-chantier/" class="btn btn-outline btn-lg">Trouver mon aspirateur</a>
                  </div>
                </div>
                <div class="home-hero-visual">
                  <img src="/assets/generated/aspirateur-renovation-captage.webp" alt="Travail de rénovation avec un outil raccordé à un aspirateur de chantier générique" width="1024" height="672" loading="eager" decoding="async">
                </div>
              </div>
            </div>
          </section>'''

          pattern = re.compile(
              r'<section class="hero home-hero">.*?</section>\s*<section class="home-orientation">.*?</section>',
              re.S,
          )
          html, count = pattern.subn(hero, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one hero+orientation replacement, got {count}')

          reading = '''
          <section class="section home-reading-section">
            <div class="container">
              <div class="section-head home-centered-heading">
                <p class="eyebrow">À lire maintenant</p>
                <h2>Trois situations concrètes pour partir du bon besoin</h2>
                <p>Avant de comparer une fiche technique, regardez comment l’aspirateur doit réellement travailler avec le matériau et l’outil.</p>
              </div>
              <div class="home-reading-grid">
                <a href="/usages/aspirateur-ponceuse/" class="home-reading-card">
                  <div class="home-reading-media"><img src="/assets/generated/aspirateur-ponceuse-captage.webp" alt="Ponceuse reliée à un aspirateur de chantier générique" loading="lazy" decoding="async"></div>
                  <div class="home-reading-body"><span class="ctype ctype-guide">Usage</span><h3>Aspirer avec une ponceuse</h3><p>Raccord, flexible, déclenchement et maintien du débit pendant une session poussiéreuse.</p><span class="home-reading-link">Lire le guide →</span></div>
                </a>
                <a href="/usages/aspirateur-gravats/" class="home-reading-card">
                  <div class="home-reading-media"><img src="/assets/generated/aspirateur-gravats-nettoyage.webp" alt="Nettoyage de petits gravats avec un aspirateur de chantier" loading="lazy" decoding="async"></div>
                  <div class="home-reading-body"><span class="ctype ctype-guide">Usage</span><h3>Nettoyer gravats et résidus</h3><p>Ce qu’il faut retirer à la main, ce que l’aspirateur peut prendre et où la cuve compte vraiment.</p><span class="home-reading-link">Lire le guide →</span></div>
                </a>
                <a href="/usages/aspirateur-scie/" class="home-reading-card">
                  <div class="home-reading-media"><img src="/assets/generated/aspirateur-scie-captage.webp" alt="Scie générique reliée à un aspirateur de chantier pendant une coupe" loading="lazy" decoding="async"></div>
                  <div class="home-reading-body"><span class="ctype ctype-guide">Usage</span><h3>Choisir autour d’une scie</h3><p>Le capot, le raccord et le volume de matière changent plus le résultat qu’un chiffre isolé de puissance.</p><span class="home-reading-link">Lire le guide →</span></div>
                </a>
              </div>
            </div>
          </section>

          '''

          marker = '<section class="section section--alt">\n  <div class="container">\n    <div class="section-head"><p class="eyebrow">Marques</p>'
          if marker not in html:
              raise SystemExit('Brand section marker not found')
          html = html.replace(marker, reading + marker, 1)
          index.write_text(html, encoding='utf-8')

          css_path = Path('home-model-polish.css')
          css = css_path.read_text(encoding='utf-8')
          marker_css = '/* ---------- Homepage BNN rhythm tune ---------- */'
          if marker_css not in css:
              css += '''\n\n/* ---------- Homepage BNN rhythm tune ---------- */
          .design-v2.design-home .home-hero-grid {
            grid-template-columns: minmax(0, 1fr) minmax(360px, .92fr);
            align-items: stretch;
            gap: clamp(38px, 6vw, 78px);
          }
          .design-v2.design-home .home-hero-copy {
            align-self: center;
            padding: 26px 0;
          }
          .design-v2.design-home .home-hero-copy .hero-desc {
            max-width: 610px;
            font-size: clamp(1rem, 1.5vw, 1.12rem);
          }
          .design-v2.design-home .home-hero-visual {
            min-height: 390px;
            overflow: hidden;
            border: 1px solid var(--v2-rule);
            background: #e8e7e1;
          }
          .design-v2.design-home .home-hero-visual img {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 390px;
            object-fit: cover;
          }
          .design-v2.design-home .home-hero + .section--alt {
            border-top: 1px solid var(--v2-rule);
          }
          .design-v2.design-home .section-head.home-centered-heading,
          .design-v2.design-home .section--alt > .container > .section-head:first-child {
            max-width: 720px;
          }
          .design-v2.design-home .home-reading-section {
            border-top: 1px solid var(--v2-rule);
            border-bottom: 1px solid var(--v2-rule);
            background: #f8f7f2;
          }
          .design-v2.design-home .home-reading-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
          }
          .design-v2.design-home .home-reading-card {
            display: flex;
            min-width: 0;
            flex-direction: column;
            color: var(--v2-ink);
            text-decoration: none;
            background: rgba(255,255,255,.38);
            border: 1px solid var(--v2-rule);
          }
          .design-v2.design-home .home-reading-card:hover {
            border-color: #9da4a8;
          }
          .design-v2.design-home .home-reading-media {
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #e7e6e0;
          }
          .design-v2.design-home .home-reading-media img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .25s ease;
          }
          .design-v2.design-home .home-reading-card:hover .home-reading-media img {
            transform: scale(1.015);
          }
          .design-v2.design-home .home-reading-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 18px 18px 17px;
          }
          .design-v2.design-home .home-reading-body h3 {
            margin: 10px 0 7px;
            font-size: 1.08rem;
            line-height: 1.22;
          }
          .design-v2.design-home .home-reading-body p {
            margin: 0 0 16px;
            color: var(--v2-muted);
            font-size: .82rem;
            line-height: 1.55;
          }
          .design-v2.design-home .home-reading-link {
            margin-top: auto;
            color: var(--v2-blue);
            font-size: .77rem;
            font-weight: 650;
          }
          .design-v2.design-home .usage-grid {
            gap: 14px;
          }
          .design-v2.design-home .usage-card {
            min-height: 150px;
          }
          @media (max-width: 1024px) {
            .design-v2.design-home .home-hero-grid { grid-template-columns: 1fr; }
            .design-v2.design-home .home-hero-visual { min-height: 340px; max-width: 760px; }
            .design-v2.design-home .home-hero-visual img { min-height: 340px; }
            .design-v2.design-home .home-reading-grid { grid-template-columns: 1fr 1fr; }
          }
          @media (max-width: 680px) {
            .design-v2.design-home .home-hero-visual,
            .design-v2.design-home .home-hero-visual img { min-height: 250px; }
            .design-v2.design-home .home-reading-grid { grid-template-columns: 1fr; }
            .design-v2.design-home .home-reading-card { display: grid; grid-template-columns: 124px minmax(0, 1fr); }
            .design-v2.design-home .home-reading-media { aspect-ratio: auto; min-height: 100%; }
            .design-v2.design-home .home-reading-body { padding: 15px; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Sanity checks
        run: |
          grep -q 'Le bon aspirateur de chantier' index.html
          grep -q 'aspirateur-renovation-captage.webp' index.html
          grep -q 'Trois situations concrètes' index.html
          ! grep -q '<section class="home-orientation">' index.html
          grep -q '<meta name="robots" content="noindex, follow">' index.html
          grep -q 'Homepage BNN rhythm tune' home-model-polish.css

      - name: Commit tuned homepage and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/tune-home-bnn-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-model-polish.css .github/workflows/tune-home-bnn-once.yml
          git commit -m "design: tune homepage rhythm toward bloc-notes"
          git push origin HEAD:feat/home-bnn-tune
