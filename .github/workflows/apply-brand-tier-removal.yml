name: Apply brand tier removal

on:
  push:
    branches:
      - remove-brand-tiers-final
    paths:
      - '_remove_brand_tiers.py'
      - '.github/workflows/apply-brand-tier-removal.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-brand-tiers-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tier removal to source and rendered HTML
        run: python _remove_brand_tiers.py
      - name: Validate migration
        run: python _remove_brand_tiers.py --check
      - name: Check whitespace
        run: git diff --check
      - name: Commit migrated navigation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _generate.py .
          git commit -m "Remove brand tier labels from global navigation"
          git push origin HEAD:remove-brand-tiers-final
