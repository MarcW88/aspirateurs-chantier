name: Generate GAS 18V-10 L pilot

on:
  push:
    branches:
      - feat/model-gas18v10l
    paths:
      - ".content/models/pages/bosch-gas-18v-10-l.html"
      - ".content/models/pages/bosch-gas-18v-10-l.meta.json"
      - ".github/workflows/generate-model-gas18v10l.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-gas18v10l
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render model pages
        run: python _generate_model_overrides.py
      - name: Commit only the GAS 18V-10 L rendered page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeles/bosch-gas-18v-10-l/index.html
          if git diff --cached --quiet; then
            echo "No rendered model changes"
          else
            git commit -m "content: render GAS 18V-10 L model"
            git push origin HEAD:feat/model-gas18v10l
          fi
